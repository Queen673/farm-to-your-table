services:
  - type: web
    name: ftyt-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
